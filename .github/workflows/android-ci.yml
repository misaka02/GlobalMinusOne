name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Compile AndroidTest Kotlin
        run: ./gradlew compileDebugAndroidTestKotlin --no-daemon --console=plain

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --console=plain

      - name: Assemble Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --console=plain

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlobalMinusOne-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GlobalMinusOne-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.*
